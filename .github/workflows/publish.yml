# Publishes pesto-genetics to PyPI when a tag vX.Y.Z is pushed.
#
# No token: PyPI trusts this workflow of this repository through OpenID Connect
# (Trusted Publishing, environment "pypi"). The tag must match the version in
# pyproject.toml, so a tag pushed by mistake publishes nothing.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but pyproject.toml says $version"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
