[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pesto-genetics"
version = "0.4.0"
description = "PESTO: is a gene-phenotype association already known? Prior evidence from the literature and from Open Targets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeremy Guez" }]
keywords = ["genetics", "literature", "novelty", "gene-phenotype", "rare variants", "GWAS"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anthropic>=0.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "python-dotenv>=1.0",
    # The Open Targets matcher ranks a gene's traits with a 110M-parameter
    # embedding model before reading the nearest twenty. `--ot-encoder none`
    # reads the whole answer without it.
    "torch>=2.0",
    "transformers>=4.30",
]

[project.urls]
Homepage = "https://github.com/jeremyguez/PESTO-release"
Source = "https://github.com/jeremyguez/PESTO-release"

[project.scripts]
pesto = "pesto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pesto = ["prompts/*.txt", "aliases.tsv", "browser/static/*"]
